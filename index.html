<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pup Evolution</title>
<!-- Web demo build (shareable link). Same game files as the YouTube build, without the YouTube Playables SDK:
     outside YouTube the game saves in the browser and the video buttons say "on YouTube". -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6cc8ff; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script id="loader">
// Loads the game scripts in order. Each address carries the build tag (?v=) so a new version never runs on cached
// old files; if a host refuses the tag, that file loads by its plain name instead. Bump V (and index.html) on every release.
(function () {
  var V = "1.3", files = ["dogs", "world", "sfx", "game", "ranch", "ui", "main"], i = 0;
  function next(tag) {
    if (i >= files.length) return;
    var s = document.createElement("script"), name = "js/" + files[i] + ".js";
    s.src = tag ? name + "?v=" + V : name;
    s.onload = function () { i++; next(true); };
    s.onerror = function () { if (tag) next(false); };
    document.body.appendChild(s);
  }
  next(true);
})();
</script>
<script>document.getElementById('c').addEventListener('pointerdown', (e) => { try { e.target.focus({ preventScroll: true }); } catch (err) {} });</script>
</body>
</html>
